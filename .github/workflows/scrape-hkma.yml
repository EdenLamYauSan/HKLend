name: Scrape CR Money Lender Registry

on:
  # Every Monday at 03:00 UTC
  schedule:
    - cron: '0 3 * * 1'
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  scrape:
    name: Fetch & upsert CR licensee records
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Python dependencies
        run: pip install pypdf

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install scraper dependencies
        working-directory: scripts/scraper
        run: npm install

      - name: Run CR scraper
        working-directory: scripts/scraper
        run: npx tsx src/scrape-hkma.ts --cr
        env:
          SCRAPER_DATABASE_URL: ${{ secrets.SCRAPER_DATABASE_URL }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NODE_ENV: production
