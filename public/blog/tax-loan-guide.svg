<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <defs>
    <linearGradient id="tlbg" x1="0" y1="0" x2="800" y2="320">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" rx="16" fill="url(#tlbg)"/>
  <text x="400" y="45" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">月平息 vs 實際年利率 APR</text>
  <!-- Left box: 月平息 -->
  <rect x="80" y="70" width="260" height="180" rx="12" fill="#fff8f0" stroke="#c9b99a" stroke-width="1.5"/>
  <text x="210" y="100" text-anchor="middle" font-family="serif" font-size="14" fill="#8b7355">月平息</text>
  <text x="210" y="135" text-anchor="middle" font-family="serif" font-size="38" fill="#4a3520" font-weight="bold">0.2%</text>
  <text x="210" y="160" text-anchor="middle" font-family="serif" font-size="12" fill="#8b7355">每月利率顯示</text>
  <line x1="110" y1="178" x2="310" y2="178" stroke="#e0d5c3" stroke-width="1"/>
  <text x="210" y="200" text-anchor="middle" font-family="serif" font-size="11" fill="#b5402a">≠ 年息 2.4%</text>
  <text x="210" y="220" text-anchor="middle" font-family="serif" font-size="11" fill="#8b7355">實際成本更高</text>
  <!-- Arrow -->
  <text x="400" y="170" text-anchor="middle" font-family="serif" font-size="28" fill="#c9b99a">→</text>
  <!-- Right box: APR -->
  <rect x="460" y="70" width="260" height="180" rx="12" fill="#f0f7f2" stroke="#4a7c59" stroke-width="1.5"/>
  <text x="590" y="100" text-anchor="middle" font-family="serif" font-size="14" fill="#4a7c59">實際年利率 APR</text>
  <text x="590" y="135" text-anchor="middle" font-family="serif" font-size="38" fill="#4a3520" font-weight="bold">4.8%</text>
  <text x="590" y="160" text-anchor="middle" font-family="serif" font-size="12" fill="#8b7355">年化真實成本</text>
  <line x1="490" y1="178" x2="690" y2="178" stroke="#c8ddd0" stroke-width="1"/>
  <text x="590" y="200" text-anchor="middle" font-family="serif" font-size="11" fill="#4a7c59">反映還款結構</text>
  <text x="590" y="220" text-anchor="middle" font-family="serif" font-size="11" fill="#4a7c59">適合橫向比較</text>
  <!-- Bottom note -->
  <rect x="180" y="268" width="440" height="36" rx="8" fill="#fff8f0" stroke="#c9b99a" stroke-width="1"/>
  <text x="400" y="292" text-anchor="middle" font-family="serif" font-size="12" fill="#6b4226">比較前先問：APR 係幾多？總共要還幾多？</text>
  <circle cx="50" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
  <circle cx="750" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
</svg>
