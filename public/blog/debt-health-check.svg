<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="800" y2="320">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" rx="16" fill="url(#dbg)"/>
  <text x="400" y="45" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">債務健康指標</text>
  <!-- Gauge -->
  <path d="M250 200 A120 120 0 0 1 550 200" fill="none" stroke="#e0d5c3" stroke-width="20" stroke-linecap="round"/>
  <path d="M250 200 A120 120 0 0 1 340 105" fill="none" stroke="#4a7c59" stroke-width="20" stroke-linecap="round"/>
  <path d="M340 105 A120 120 0 0 1 460 105" fill="none" stroke="#c4956a" stroke-width="20" stroke-linecap="round"/>
  <path d="M460 105 A120 120 0 0 1 550 200" fill="none" stroke="#b5402a" stroke-width="20" stroke-linecap="round"/>
  <!-- Labels -->
  <text x="270" y="240" text-anchor="middle" font-family="serif" font-size="12" fill="#4a7c59">健康</text>
  <text x="230" y="258" text-anchor="middle" font-family="serif" font-size="11" fill="#8b7355">&lt; 30%</text>
  <text x="400" y="105" text-anchor="middle" font-family="serif" font-size="12" fill="#c4956a">注意</text>
  <text x="400" y="123" text-anchor="middle" font-family="serif" font-size="11" fill="#8b7355">30-50%</text>
  <text x="530" y="240" text-anchor="middle" font-family="serif" font-size="12" fill="#b5402a">危險</text>
  <text x="570" y="258" text-anchor="middle" font-family="serif" font-size="11" fill="#8b7355">&gt; 50%</text>
  <!-- Center text -->
  <text x="400" y="180" text-anchor="middle" font-family="serif" font-size="14" fill="#4a3520">月供 ÷ 月入</text>
  <text x="400" y="205" text-anchor="middle" font-family="serif" font-size="28" fill="#4a3520" font-weight="bold">≤ 40%</text>
  <text x="400" y="225" text-anchor="middle" font-family="serif" font-size="12" fill="#8b7355">建議上限</text>
  <!-- Bottom note -->
  <rect x="180" y="270" width="440" height="36" rx="8" fill="#fff8f0" stroke="#c9b99a" stroke-width="1"/>
  <text x="400" y="294" text-anchor="middle" font-family="serif" font-size="12" fill="#6b4226">包括所有貸款 + 信用卡最低還款額 ÷ 每月收入</text>
  <!-- Decorative -->
  <circle cx="50" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
  <circle cx="750" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
</svg>
