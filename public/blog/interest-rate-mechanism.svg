<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" fill="none">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="800" y2="380">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="380" rx="16" fill="url(#ibg)"/>
  <text x="400" y="45" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">香港利率傳導機制</text>
  <!-- US Fed -->
  <rect x="280" y="70" width="240" height="50" rx="12" fill="#8b5e3c"/>
  <text x="400" y="100" text-anchor="middle" font-family="serif" font-size="15" fill="#fff" font-weight="bold">美國聯儲局利率</text>
  <!-- Arrow down -->
  <path d="M400 120 L400 150" stroke="#c4956a" stroke-width="2"/>
  <polygon points="395,148 400,158 405,148" fill="#c4956a"/>
  <!-- HK Link -->
  <rect x="300" y="160" width="200" height="40" rx="10" fill="#f5ede0" stroke="#c9b99a" stroke-width="1.2"/>
  <text x="400" y="185" text-anchor="middle" font-family="serif" font-size="13" fill="#5a3e28">聯繫匯率制度</text>
  <!-- Arrow splits -->
  <path d="M400 200 L400 220 L250 240" stroke="#c4956a" stroke-width="1.5" fill="none"/>
  <path d="M400 220 L550 240" stroke="#c4956a" stroke-width="1.5" fill="none"/>
  <polygon points="245,236 250,246 255,236" fill="#c4956a"/>
  <polygon points="545,236 550,246 555,236" fill="#c4956a"/>
  <!-- HIBOR -->
  <rect x="150" y="248" width="200" height="50" rx="12" fill="#c4956a"/>
  <text x="250" y="268" text-anchor="middle" font-family="serif" font-size="14" fill="#fff" font-weight="bold">HIBOR（H）</text>
  <text x="250" y="286" text-anchor="middle" font-family="serif" font-size="11" fill="#f0e8dc">銀行同業拆息</text>
  <!-- Prime -->
  <rect x="450" y="248" width="200" height="50" rx="12" fill="#4a7c59"/>
  <text x="550" y="268" text-anchor="middle" font-family="serif" font-size="14" fill="#fff" font-weight="bold">Prime Rate（P）</text>
  <text x="550" y="286" text-anchor="middle" font-family="serif" font-size="11" fill="#f0e8dc">最優惠利率</text>
  <!-- H按 -->
  <path d="M250 298 L250 320" stroke="#c4956a" stroke-width="1.5"/>
  <polygon points="245,318 250,328 255,318" fill="#c4956a"/>
  <rect x="170" y="330" width="160" height="36" rx="8" fill="#f5ede0" stroke="#c4956a" stroke-width="1.2"/>
  <text x="250" y="353" text-anchor="middle" font-family="serif" font-size="13" fill="#5a3e28">H 按（H+1.3%）</text>
  <!-- P按 -->
  <path d="M550 298 L550 320" stroke="#4a7c59" stroke-width="1.5"/>
  <polygon points="545,318 550,328 555,318" fill="#4a7c59"/>
  <rect x="470" y="330" width="160" height="36" rx="8" fill="#f5ede0" stroke="#4a7c59" stroke-width="1.2"/>
  <text x="550" y="353" text-anchor="middle" font-family="serif" font-size="13" fill="#5a3e28">P 按（P−2.25%）</text>
  <!-- Note: cap connection -->
  <path d="M330 348 L470 348" stroke="#c9b99a" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="400" y="342" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">P 封頂保護</text>
  <!-- Decorative -->
  <circle cx="50" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
  <circle cx="750" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
</svg>
