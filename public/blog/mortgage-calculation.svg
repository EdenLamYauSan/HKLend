<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" fill="none">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="800" y2="360">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" rx="16" fill="url(#mbg)"/>
  <text x="400" y="45" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">按揭供款計算示意</text>
  <!-- House icon -->
  <polygon points="400,80 340,130 460,130" fill="none" stroke="#8b5e3c" stroke-width="2.5"/>
  <rect x="360" y="130" width="80" height="55" fill="none" stroke="#8b5e3c" stroke-width="2"/>
  <rect x="385" y="150" width="30" height="35" fill="none" stroke="#c4956a" stroke-width="1.5"/>
  <!-- Flow arrows -->
  <text x="200" y="230" text-anchor="middle" font-family="serif" font-size="15" fill="#5a3e28">樓價</text>
  <rect x="145" y="240" width="110" height="36" rx="8" fill="#f5ede0" stroke="#c9b99a" stroke-width="1.2"/>
  <text x="200" y="264" text-anchor="middle" font-family="serif" font-size="14" fill="#6b4226">$8,000,000</text>
  <path d="M260 258 L310 258" stroke="#c4956a" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <text x="400" y="230" text-anchor="middle" font-family="serif" font-size="15" fill="#5a3e28">按揭成數</text>
  <rect x="345" y="240" width="110" height="36" rx="8" fill="#f5ede0" stroke="#c9b99a" stroke-width="1.2"/>
  <text x="400" y="264" text-anchor="middle" font-family="serif" font-size="14" fill="#6b4226">70%（七成）</text>
  <path d="M460 258 L510 258" stroke="#c4956a" stroke-width="1.5"/>
  <text x="600" y="230" text-anchor="middle" font-family="serif" font-size="15" fill="#5a3e28">貸款額</text>
  <rect x="545" y="240" width="110" height="36" rx="8" fill="#8b5e3c" stroke="#6b4226" stroke-width="1.2"/>
  <text x="600" y="264" text-anchor="middle" font-family="serif" font-size="14" fill="#faf6f1" font-weight="bold">$5,600,000</text>
  <!-- Bottom row -->
  <rect x="200" y="305" width="400" height="40" rx="10" fill="#f5ede0" stroke="#c9b99a" stroke-width="1.2"/>
  <text x="400" y="331" text-anchor="middle" font-family="serif" font-size="14" fill="#5a3e28">利率 3.625% ╱ 30年期 → 月供約 $25,540</text>
  <!-- Decorative circles -->
  <circle cx="50" cy="40" r="18" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
  <circle cx="750" cy="40" r="18" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
</svg>
