<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" fill="none">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="800" y2="340">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="340" rx="16" fill="url(#tbg)"/>
  <text x="400" y="45" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">TU 環聯信貸評分等級</text>
  <!-- Grade bars -->
  <rect x="100" y="80" width="600" height="40" rx="8" fill="#f5ede0" stroke="#c9b99a" stroke-width="1"/>
  <rect x="100" y="80" width="120" height="40" rx="8" fill="#4a7c59"/>
  <text x="160" y="106" text-anchor="middle" font-family="serif" font-size="16" fill="#fff" font-weight="bold">A 級</text>
  <text x="160" y="140" text-anchor="middle" font-family="serif" font-size="12" fill="#4a7c59">優良</text>
  <rect x="220" y="80" width="180" height="40" rx="0" fill="#8ba86e"/>
  <text x="310" y="106" text-anchor="middle" font-family="serif" font-size="16" fill="#fff" font-weight="bold">B — D 級</text>
  <text x="310" y="140" text-anchor="middle" font-family="serif" font-size="12" fill="#6b7d4e">一般至偏低</text>
  <rect x="400" y="80" width="300" height="40" rx="0" fill="#c4956a"/>
  <rect x="580" y="80" width="120" height="40" rx="0 8 8 0" fill="#8b5e3c"/>
  <text x="490" y="106" text-anchor="middle" font-family="serif" font-size="16" fill="#fff" font-weight="bold">E — J 級</text>
  <text x="510" y="140" text-anchor="middle" font-family="serif" font-size="12" fill="#8b5e3c">差</text>
  <!-- Descriptions -->
  <rect x="80" y="170" width="200" height="70" rx="10" fill="#f5ede0" stroke="#4a7c59" stroke-width="1.5"/>
  <text x="180" y="195" text-anchor="middle" font-family="serif" font-size="13" fill="#4a3520">申請最順利</text>
  <text x="180" y="215" text-anchor="middle" font-family="serif" font-size="13" fill="#4a3520">利率最低</text>
  <rect x="300" y="170" width="200" height="70" rx="10" fill="#f5ede0" stroke="#8ba86e" stroke-width="1.5"/>
  <text x="400" y="195" text-anchor="middle" font-family="serif" font-size="13" fill="#4a3520">仍可借貸</text>
  <text x="400" y="215" text-anchor="middle" font-family="serif" font-size="13" fill="#4a3520">利率較高</text>
  <rect x="520" y="170" width="200" height="70" rx="10" fill="#f5ede0" stroke="#8b5e3c" stroke-width="1.5"/>
  <text x="620" y="195" text-anchor="middle" font-family="serif" font-size="13" fill="#4a3520">大部分銀行</text>
  <text x="620" y="215" text-anchor="middle" font-family="serif" font-size="13" fill="#4a3520">會拒絕申請</text>
  <!-- Tip -->
  <rect x="150" y="270" width="500" height="45" rx="10" fill="#fff8f0" stroke="#c9b99a" stroke-width="1"/>
  <text x="400" y="298" text-anchor="middle" font-family="serif" font-size="13" fill="#6b4226">每年可免費喺 TU 官網索取一次信貸報告</text>
  <!-- Decorative -->
  <circle cx="55" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
  <circle cx="745" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
</svg>
