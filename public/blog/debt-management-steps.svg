<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="800" y2="320">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" rx="16" fill="url(#sbg)"/>
  <text x="400" y="45" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">債務管理四步曲</text>
  <!-- Step 1 -->
  <circle cx="130" cy="150" r="45" fill="#8b5e3c"/>
  <text x="130" y="140" text-anchor="middle" font-family="serif" font-size="24" fill="#fff" font-weight="bold">1</text>
  <text x="130" y="162" text-anchor="middle" font-family="serif" font-size="12" fill="#f0e8dc">盤點</text>
  <text x="130" y="220" text-anchor="middle" font-family="serif" font-size="12" fill="#5a3e28">攤開所有數</text>
  <text x="130" y="238" text-anchor="middle" font-family="serif" font-size="11" fill="#8b7355">列出每筆債務</text>
  <!-- Arrow -->
  <path d="M185 150 L245 150" stroke="#c4956a" stroke-width="2" marker-end="url(#arr)"/>
  <polygon points="245,145 255,150 245,155" fill="#c4956a"/>
  <!-- Step 2 -->
  <circle cx="310" cy="150" r="45" fill="#c4956a"/>
  <text x="310" y="140" text-anchor="middle" font-family="serif" font-size="24" fill="#fff" font-weight="bold">2</text>
  <text x="310" y="162" text-anchor="middle" font-family="serif" font-size="12" fill="#fff">策略</text>
  <text x="310" y="220" text-anchor="middle" font-family="serif" font-size="12" fill="#5a3e28">揀還款方法</text>
  <text x="310" y="238" text-anchor="middle" font-family="serif" font-size="11" fill="#8b7355">雪崩或雪球法</text>
  <!-- Arrow -->
  <path d="M365 150 L425 150" stroke="#c4956a" stroke-width="2"/>
  <polygon points="425,145 435,150 425,155" fill="#c4956a"/>
  <!-- Step 3 -->
  <circle cx="490" cy="150" r="45" fill="#4a7c59"/>
  <text x="490" y="140" text-anchor="middle" font-family="serif" font-size="24" fill="#fff" font-weight="bold">3</text>
  <text x="490" y="162" text-anchor="middle" font-family="serif" font-size="12" fill="#f0e8dc">執行</text>
  <text x="490" y="220" text-anchor="middle" font-family="serif" font-size="12" fill="#5a3e28">搵額外資金</text>
  <text x="490" y="238" text-anchor="middle" font-family="serif" font-size="11" fill="#8b7355">開源 + 節流</text>
  <!-- Arrow -->
  <path d="M545 150 L605 150" stroke="#c4956a" stroke-width="2"/>
  <polygon points="605,145 615,150 605,155" fill="#c4956a"/>
  <!-- Step 4 -->
  <circle cx="670" cy="150" r="45" fill="#8b5e3c"/>
  <text x="670" y="140" text-anchor="middle" font-family="serif" font-size="24" fill="#fff" font-weight="bold">4</text>
  <text x="670" y="162" text-anchor="middle" font-family="serif" font-size="12" fill="#f0e8dc">防線</text>
  <text x="670" y="220" text-anchor="middle" font-family="serif" font-size="12" fill="#5a3e28">避免再欠債</text>
  <text x="670" y="238" text-anchor="middle" font-family="serif" font-size="11" fill="#8b7355">緊急儲備 + 預算</text>
  <!-- Bottom motivational -->
  <rect x="220" y="270" width="360" height="36" rx="10" fill="#fff8f0" stroke="#c9b99a" stroke-width="1"/>
  <text x="400" y="294" text-anchor="middle" font-family="serif" font-size="14" fill="#6b4226" font-weight="bold">堅持就係勝利</text>
</svg>
