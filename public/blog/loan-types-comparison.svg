<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="800" y2="400">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5e3c"/>
      <stop offset="100%" stop-color="#6b4226"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4956a"/>
      <stop offset="100%" stop-color="#a67b50"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="16" fill="url(#bg1)"/>
  <line x1="100" y1="340" x2="750" y2="340" stroke="#c9b99a" stroke-width="1.5"/>
  <line x1="100" y1="260" x2="750" y2="260" stroke="#e0d5c3" stroke-width="0.8" stroke-dasharray="6,4"/>
  <line x1="100" y1="180" x2="750" y2="180" stroke="#e0d5c3" stroke-width="0.8" stroke-dasharray="6,4"/>
  <line x1="100" y1="100" x2="750" y2="100" stroke="#e0d5c3" stroke-width="0.8" stroke-dasharray="6,4"/>
  <text x="85" y="344" text-anchor="end" font-family="serif" font-size="12" fill="#8b7355">0%</text>
  <text x="85" y="264" text-anchor="end" font-family="serif" font-size="12" fill="#8b7355">10%</text>
  <text x="85" y="184" text-anchor="end" font-family="serif" font-size="12" fill="#8b7355">20%</text>
  <text x="85" y="104" text-anchor="end" font-family="serif" font-size="12" fill="#8b7355">30%</text>
  <!-- Bars -->
  <rect x="140" y="308" width="80" height="32" rx="4" fill="url(#bar1)"/>
  <text x="180" y="360" text-anchor="middle" font-family="serif" font-size="13" fill="#5a3e28">私人貸款</text>
  <text x="180" y="302" text-anchor="middle" font-family="serif" font-size="11" fill="#6b4226">2-20%</text>
  <rect x="270" y="320" width="80" height="20" rx="4" fill="url(#bar2)"/>
  <text x="310" y="360" text-anchor="middle" font-family="serif" font-size="13" fill="#5a3e28">按揭</text>
  <text x="310" y="314" text-anchor="middle" font-family="serif" font-size="11" fill="#a67b50">~2.5%</text>
  <rect x="400" y="326" width="80" height="14" rx="4" fill="url(#bar1)"/>
  <text x="440" y="360" text-anchor="middle" font-family="serif" font-size="13" fill="#5a3e28">稅貸</text>
  <text x="440" y="320" text-anchor="middle" font-family="serif" font-size="11" fill="#6b4226">1-4%</text>
  <rect x="530" y="314" width="80" height="26" rx="4" fill="url(#bar2)"/>
  <text x="570" y="360" text-anchor="middle" font-family="serif" font-size="13" fill="#5a3e28">結餘轉戶</text>
  <text x="570" y="308" text-anchor="middle" font-family="serif" font-size="11" fill="#a67b50">2-8%</text>
  <rect x="660" y="260" width="80" height="80" rx="4" fill="url(#bar1)"/>
  <text x="700" y="360" text-anchor="middle" font-family="serif" font-size="13" fill="#5a3e28">循環貸款</text>
  <text x="700" y="254" text-anchor="middle" font-family="serif" font-size="11" fill="#6b4226">6-30%</text>
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">五種貸款年利率範圍比較</text>
  <!-- Decorative -->
  <circle cx="60" cy="50" r="20" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
  <circle cx="60" cy="50" r="12" fill="none" stroke="#c9b99a" stroke-width="0.5"/>
  <circle cx="740" cy="50" r="20" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
  <circle cx="740" cy="50" r="12" fill="none" stroke="#c9b99a" stroke-width="0.5"/>
</svg>
