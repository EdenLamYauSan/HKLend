<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <defs>
    <linearGradient id="crbg" x1="0" y1="0" x2="800" y2="320">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" rx="16" fill="url(#crbg)"/>
  <text x="400" y="45" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">信貸報告：五個主要部分</text>
  <!-- Report document mockup -->
  <rect x="60" y="65" width="200" height="220" rx="8" fill="#fff8f0" stroke="#c9b99a" stroke-width="1.5"/>
  <rect x="60" y="65" width="200" height="30" rx="8" fill="#4a3520"/>
  <rect x="60" y="86" width="200" height="12" fill="#4a3520"/>
  <text x="160" y="85" text-anchor="middle" font-family="serif" font-size="11" fill="#fff8f0">個人信貸報告</text>
  <!-- Section lines -->
  <rect x="75" y="108" width="170" height="22" rx="4" fill="#f0e8dc"/>
  <text x="160" y="123" text-anchor="middle" font-family="serif" font-size="10" fill="#4a3520">個人資料</text>
  <rect x="75" y="136" width="170" height="22" rx="4" fill="#f0e8dc"/>
  <text x="160" y="151" text-anchor="middle" font-family="serif" font-size="10" fill="#4a3520">信貸帳戶</text>
  <rect x="75" y="164" width="170" height="22" rx="4" fill="#f0e8dc"/>
  <text x="160" y="179" text-anchor="middle" font-family="serif" font-size="10" fill="#4a3520">還款紀錄</text>
  <rect x="75" y="192" width="170" height="22" rx="4" fill="#f0e8dc"/>
  <text x="160" y="207" text-anchor="middle" font-family="serif" font-size="10" fill="#4a3520">信貸查詢</text>
  <rect x="75" y="220" width="170" height="22" rx="4" fill="#c4956a" opacity="0.3"/>
  <text x="160" y="235" text-anchor="middle" font-family="serif" font-size="10" fill="#4a3520">評分 / TU</text>
  <!-- Annotation lines -->
  <line x1="265" y1="119" x2="330" y2="119" stroke="#c9b99a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="335" y="114" font-family="serif" font-size="10" fill="#4a3520">有冇陌生資料？</text>
  <line x1="265" y1="147" x2="330" y2="147" stroke="#c9b99a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="335" y="142" font-family="serif" font-size="10" fill="#4a3520">有冇不屬於你嘅帳戶？</text>
  <line x1="265" y1="175" x2="330" y2="175" stroke="#b5402a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="335" y="170" font-family="serif" font-size="10" fill="#b5402a">有冇逾期紀錄？</text>
  <line x1="265" y1="203" x2="330" y2="203" stroke="#b5402a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="335" y="198" font-family="serif" font-size="10" fill="#b5402a">有冇不明申請？</text>
  <line x1="265" y1="231" x2="330" y2="231" stroke="#c9b99a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="335" y="226" font-family="serif" font-size="10" fill="#8b7355">唔好只睇分數</text>
  <!-- Right: free report note -->
  <rect x="560" y="100" width="200" height="90" rx="10" fill="#f0f7f2" stroke="#4a7c59" stroke-width="1.5"/>
  <text x="660" y="125" text-anchor="middle" font-family="serif" font-size="12" fill="#4a7c59" font-weight="bold">免費報告</text>
  <text x="660" y="148" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">每 12 個月</text>
  <text x="660" y="166" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">可向 TransUnion</text>
  <text x="660" y="184" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">申請一次</text>
  <!-- Bottom note -->
  <rect x="160" y="268" width="480" height="36" rx="8" fill="#fff8f0" stroke="#c9b99a" stroke-width="1"/>
  <text x="400" y="292" text-anchor="middle" font-family="serif" font-size="11" fill="#6b4226">早發現異常，早保留證據。唔好等到被拒貸先查。</text>
  <circle cx="50" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
  <circle cx="750" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
</svg>
