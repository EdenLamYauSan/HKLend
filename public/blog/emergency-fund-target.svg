      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" rx="16" fill="url(#ebg)"/>
  <text x="400" y="42" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">應急儲備金目標</text>
  <!-- Jar visual -->
  <rect x="320" y="65" width="160" height="160" rx="14" fill="#f5ede0" stroke="#c9b99a" stroke-width="2"/>
  <rect x="350" y="55" width="100" height="18" rx="6" fill="#c9b99a"/>
  <!-- Fill levels -->
  <rect x="325" y="175" width="150" height="45" rx="0" fill="#4a7c59" opacity="0.7"/>
  <text x="400" y="203" text-anchor="middle" font-family="serif" font-size="11" fill="#fff">3 個月 — 基本</text>
  <rect x="325" y="130" width="150" height="45" rx="0" fill="#8ba86e" opacity="0.6"/>
  <text x="400" y="158" text-anchor="middle" font-family="serif" font-size="11" fill="#fff">4-5 個月 — 穩健</text>
  <rect x="325" y="85" width="150" height="45" rx="0" fill="#c4d4a0" opacity="0.5"/>
  <text x="400" y="113" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">6 個月 — 安全</text>
