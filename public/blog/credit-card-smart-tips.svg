<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" fill="none">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="800" y2="340">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="340" rx="16" fill="url(#cbg)"/>
  <text x="400" y="42" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">信用卡聰明用法</text>
  <!-- Card icon -->
  <rect x="340" y="58" width="120" height="75" rx="10" fill="#8b5e3c"/>
  <rect x="340" y="83" width="120" height="14" fill="#6b4226"/>
  <rect x="352" y="108" width="40" height="12" rx="3" fill="#c4956a"/>
  <!-- 5 tips in a circle layout -->
  <rect x="40" y="160" width="135" height="75" rx="10" fill="#f5ede0" stroke="#8b5e3c" stroke-width="1.2"/>
  <circle cx="68" cy="182" r="12" fill="#8b5e3c"/>
  <text x="68" y="187" text-anchor="middle" font-family="serif" font-size="12" fill="#fff" font-weight="bold">1</text>
  <text x="110" y="182" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">揀啱卡種</text>
  <text x="107" y="200" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">配合消費模式</text>
  <text x="107" y="215" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">一至兩張主力卡</text>
  <rect x="195" y="160" width="135" height="75" rx="10" fill="#f5ede0" stroke="#c4956a" stroke-width="1.2"/>
  <circle cx="223" cy="182" r="12" fill="#c4956a"/>
  <text x="223" y="187" text-anchor="middle" font-family="serif" font-size="12" fill="#fff" font-weight="bold">2</text>
  <text x="265" y="182" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">全數還款</text>
  <text x="262" y="200" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">最重要嘅一步</text>
  <text x="262" y="215" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">避免 36% 年息</text>
  <rect x="350" y="160" width="135" height="75" rx="10" fill="#f5ede0" stroke="#4a7c59" stroke-width="1.2"/>
  <circle cx="378" cy="182" r="12" fill="#4a7c59"/>
  <text x="378" y="187" text-anchor="middle" font-family="serif" font-size="12" fill="#fff" font-weight="bold">3</text>
  <text x="420" y="182" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">善用迎新</text>
  <text x="417" y="200" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">但唔好為迎新</text>
  <text x="417" y="215" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">而過度消費</text>
  <rect x="505" y="160" width="135" height="75" rx="10" fill="#f5ede0" stroke="#8b5e3c" stroke-width="1.2"/>
  <circle cx="533" cy="182" r="12" fill="#8b5e3c"/>
  <text x="533" y="187" text-anchor="middle" font-family="serif" font-size="12" fill="#fff" font-weight="bold">4</text>
  <text x="575" y="182" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">設定提醒</text>
  <text x="572" y="200" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">消費即時通知</text>
  <text x="572" y="215" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">月度上限提醒</text>
  <rect x="660" y="160" width="100" height="75" rx="10" fill="#f5ede0" stroke="#c4956a" stroke-width="1.2"/>
  <circle cx="688" cy="182" r="12" fill="#c4956a"/>
  <text x="688" y="187" text-anchor="middle" font-family="serif" font-size="12" fill="#fff" font-weight="bold">5</text>
  <text x="710" y="200" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">免息分期</text>
  <text x="710" y="215" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">有條件地</text>
  <!-- Bottom -->
  <rect x="180" y="270" width="440" height="45" rx="10" fill="#fff8f0" stroke="#c9b99a" stroke-width="1"/>
  <text x="400" y="298" text-anchor="middle" font-family="serif" font-size="13" fill="#6b4226">識用信用卡 = 免費嘅短期融資工具</text>
  <circle cx="45" cy="320" r="10" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
  <circle cx="755" cy="320" r="10" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
</svg>
