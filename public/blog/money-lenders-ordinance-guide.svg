<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <defs>
    <linearGradient id="mlbg" x1="0" y1="0" x2="800" y2="320">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" rx="16" fill="url(#mlbg)"/>
  <text x="400" y="45" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">放債人條例：利率門檻一覽</text>
  <!-- Rate bar -->
  <rect x="80" y="80" width="640" height="50" rx="8" fill="#e0d5c3"/>
  <rect x="80" y="80" width="300" height="50" rx="8" fill="#4a7c59"/>
  <rect x="380" y="80" width="170" height="50" rx="0" fill="#c4956a"/>
  <rect x="550" y="80" width="170" height="50" rx="0" fill="#b5402a"/>
  <rect x="550" y="80" width="170" height="50" rx="8" fill="none" stroke="#fff8f0" stroke-width="0"/>
  <!-- Round right side -->
  <rect x="700" y="80" width="20" height="50" rx="0" fill="#b5402a"/>
  <rect x="710" y="80" width="10" height="50" rx="8" fill="#b5402a"/>
  <!-- Labels on bar -->
  <text x="230" y="112" text-anchor="middle" font-family="serif" font-size="13" fill="#fff8f0" font-weight="bold">≤ 36%</text>
  <text x="465" y="112" text-anchor="middle" font-family="serif" font-size="12" fill="#fff8f0">36–48%</text>
  <text x="635" y="112" text-anchor="middle" font-family="serif" font-size="12" fill="#fff8f0">&gt; 48%</text>
  <!-- Descriptions below bar -->
  <text x="230" y="158" text-anchor="middle" font-family="serif" font-size="11" fill="#4a7c59" font-weight="bold">合法範圍</text>
  <text x="230" y="175" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">仍要自行比較</text>
  <text x="230" y="190" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">是否負擔得到</text>
  <text x="465" y="158" text-anchor="middle" font-family="serif" font-size="11" fill="#c4956a" font-weight="bold">推定敲詐性</text>
  <text x="465" y="175" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">可由法院處理</text>
  <text x="635" y="158" text-anchor="middle" font-family="serif" font-size="11" fill="#b5402a" font-weight="bold">法定上限以外</text>
  <text x="635" y="175" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">不應接受</text>
  <!-- Three checklist items -->
  <rect x="80" y="215" width="180" height="70" rx="8" fill="#fff8f0" stroke="#c9b99a" stroke-width="1"/>
  <text x="170" y="240" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">✓ 核實牌照</text>
  <text x="170" y="260" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">確認持牌放債人</text>
  <rect x="310" y="215" width="180" height="70" rx="8" fill="#fff8f0" stroke="#c9b99a" stroke-width="1"/>
  <text x="400" y="240" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">✓ 睇清合約</text>
  <text x="400" y="260" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">APR、費用、條款</text>
  <rect x="540" y="215" width="180" height="70" rx="8" fill="#fff8f0" stroke="#c9b99a" stroke-width="1"/>
  <text x="630" y="240" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">✓ 保留紀錄</text>
  <text x="630" y="260" text-anchor="middle" font-family="serif" font-size="10" fill="#8b7355">電郵、合約副本</text>
  <circle cx="50" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
  <circle cx="750" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
</svg>
