<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" fill="none">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="800" y2="380">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="380" rx="16" fill="url(#lbg)"/>
  <text x="400" y="45" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">借貸安全五大提示</text>
  <!-- Shield icon -->
  <path d="M400 65 L430 80 L430 110 Q430 135 400 145 Q370 135 370 110 L370 80 Z" fill="none" stroke="#4a7c59" stroke-width="2.5"/>
  <text x="400" y="115" text-anchor="middle" font-family="serif" font-size="18" fill="#4a7c59">✓</text>
  <!-- 5 tips in boxes -->
  <rect x="60" y="170" width="320" height="55" rx="10" fill="#f5ede0" stroke="#8b5e3c" stroke-width="1.2"/>
  <circle cx="90" cy="197" r="14" fill="#8b5e3c"/>
  <text x="90" y="203" text-anchor="middle" font-family="serif" font-size="14" fill="#fff" font-weight="bold">1</text>
  <text x="115" y="193" font-family="serif" font-size="13" fill="#4a3520">用年利率（APR）比較</text>
  <text x="115" y="211" font-family="serif" font-size="11" fill="#8b7355">唔好淨係睇月平息</text>
  <rect x="420" y="170" width="320" height="55" rx="10" fill="#f5ede0" stroke="#c4956a" stroke-width="1.2"/>
  <circle cx="450" cy="197" r="14" fill="#c4956a"/>
  <text x="450" y="203" text-anchor="middle" font-family="serif" font-size="14" fill="#fff" font-weight="bold">2</text>
  <text x="475" y="193" font-family="serif" font-size="13" fill="#4a3520">問清楚所有隱藏收費</text>
  <text x="475" y="211" font-family="serif" font-size="11" fill="#8b7355">手續費、罰息、年費</text>
  <rect x="60" y="245" width="320" height="55" rx="10" fill="#f5ede0" stroke="#4a7c59" stroke-width="1.2"/>
  <circle cx="90" cy="272" r="14" fill="#4a7c59"/>
  <text x="90" y="278" text-anchor="middle" font-family="serif" font-size="14" fill="#fff" font-weight="bold">3</text>
  <text x="115" y="268" font-family="serif" font-size="13" fill="#4a3520">月供唔好超過月入 40%</text>
  <text x="115" y="286" font-family="serif" font-size="11" fill="#8b7355">保持健康嘅供款比率</text>
  <rect x="420" y="245" width="320" height="55" rx="10" fill="#f5ede0" stroke="#8b5e3c" stroke-width="1.2"/>
  <circle cx="450" cy="272" r="14" fill="#8b5e3c"/>
  <text x="450" y="278" text-anchor="middle" font-family="serif" font-size="14" fill="#fff" font-weight="bold">4</text>
  <text x="475" y="268" font-family="serif" font-size="13" fill="#4a3520">唔好俾前期費用</text>
  <text x="475" y="286" font-family="serif" font-size="11" fill="#8b7355">合法中介唔收批核前費用</text>
  <rect x="240" y="320" width="320" height="55" rx="10" fill="#f5ede0" stroke="#c4956a" stroke-width="1.2"/>
  <circle cx="270" cy="347" r="14" fill="#c4956a"/>
  <text x="270" y="353" text-anchor="middle" font-family="serif" font-size="14" fill="#fff" font-weight="bold">5</text>
  <text x="295" y="343" font-family="serif" font-size="13" fill="#4a3520">保留所有合約同通訊記錄</text>
  <text x="295" y="361" font-family="serif" font-size="11" fill="#8b7355">遇到問題時嘅重要證據</text>
  <!-- Decorative -->
  <circle cx="50" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
  <circle cx="750" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
</svg>
