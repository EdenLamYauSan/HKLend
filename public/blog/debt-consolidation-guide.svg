<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <defs>
    <linearGradient id="dcbg" x1="0" y1="0" x2="800" y2="320">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" rx="16" fill="url(#dcbg)"/>
  <text x="400" y="45" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">結餘轉戶：整合多筆債務</text>
  <!-- Before: multiple debts -->
  <rect x="40" y="70" width="130" height="50" rx="8" fill="#fff0ee" stroke="#b5402a" stroke-width="1.5"/>
  <text x="105" y="100" text-anchor="middle" font-family="serif" font-size="12" fill="#b5402a">信用卡 A</text>
  <rect x="40" y="135" width="130" height="50" rx="8" fill="#fff0ee" stroke="#b5402a" stroke-width="1.5"/>
  <text x="105" y="165" text-anchor="middle" font-family="serif" font-size="12" fill="#b5402a">信用卡 B</text>
  <rect x="40" y="200" width="130" height="50" rx="8" fill="#fff0ee" stroke="#b5402a" stroke-width="1.5"/>
  <text x="105" y="230" text-anchor="middle" font-family="serif" font-size="12" fill="#b5402a">私人貸款</text>
  <text x="105" y="270" text-anchor="middle" font-family="serif" font-size="11" fill="#8b7355">多個還款日</text>
  <!-- Arrows to centre -->
  <line x1="175" y1="95" x2="305" y2="155" stroke="#c9b99a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="175" y1="160" x2="305" y2="165" stroke="#c9b99a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="175" y1="225" x2="305" y2="175" stroke="#c9b99a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Centre: new loan -->
  <rect x="305" y="120" width="190" height="100" rx="12" fill="#fff8f0" stroke="#c4956a" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" font-family="serif" font-size="13" fill="#4a3520" font-weight="bold">結餘轉戶</text>
  <text x="400" y="172" text-anchor="middle" font-family="serif" font-size="11" fill="#8b7355">新貸款承接舊債</text>
  <text x="400" y="192" text-anchor="middle" font-family="serif" font-size="11" fill="#8b7355">集中一個還款安排</text>
  <!-- Arrow right -->
  <line x1="498" y1="165" x2="580" y2="165" stroke="#4a7c59" stroke-width="2"/>
  <polygon points="578,159 590,165 578,171" fill="#4a7c59"/>
  <!-- After -->
  <rect x="588" y="130" width="160" height="70" rx="10" fill="#f0f7f2" stroke="#4a7c59" stroke-width="2"/>
  <text x="668" y="158" text-anchor="middle" font-family="serif" font-size="12" fill="#4a7c59" font-weight="bold">單一供款</text>
  <text x="668" y="178" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">更清晰</text>
  <text x="668" y="196" text-anchor="middle" font-family="serif" font-size="11" fill="#4a3520">更易管理</text>
  <!-- Bottom warning -->
  <rect x="160" y="268" width="480" height="36" rx="8" fill="#fff0ee" stroke="#b5402a" stroke-width="1"/>
  <text x="400" y="292" text-anchor="middle" font-family="serif" font-size="11" fill="#b5402a">⚠ 還款期拉長 → 總利息未必減少。先計清楚再決定。</text>
  <circle cx="50" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
  <circle cx="750" cy="40" r="16" fill="none" stroke="#c9b99a" stroke-width="0.8"/>
</svg>
